# Build, test and lint with and without the optional features.
#
# Runs on Windows, where wfscan is developed (the GUI's file dialogs need GTK on Linux).
# No Oodle library and no game cache are available here, so the real-cache tests skip;
# run them locally with WFSCAN_CACHE_DIR and WFSCAN_OODLE_DLL set.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.flags || 'default features' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The GUI always turns the core's features on, so the build without them leaves it out.
        flags: ["", "--no-default-features --exclude wfscan-gui"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flags }}
      - name: Build
        run: cargo build --workspace --all-targets ${{ matrix.flags }}
      - name: Test
        run: cargo test --workspace ${{ matrix.flags }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.flags }}

  # The core library and CLI keep the workspace MSRV; the GUI needs what egui needs.
  msrv:
    name: MSRV (${{ matrix.toolchain }}, ${{ matrix.crates }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.89"
            crates: core + cli
            packages: -p wfscan-core -p wfscan-cli -p wfscan-fixtures
          - toolchain: "1.95"
            crates: gui
            packages: -p wfscan-gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.toolchain }}
      - run: cargo check ${{ matrix.packages }} --all-targets
