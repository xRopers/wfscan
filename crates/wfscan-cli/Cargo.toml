[package]
name = "wfscan-cli"
description = "Command-line front end for wfscan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wfscan"
path = "src/main.rs"

[features]
default = ["oodle", "png", "audio"]
oodle = ["wfscan-core/oodle"]
png = ["wfscan-core/png"]
audio = ["wfscan-core/audio"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
wfscan-core.workspace = true

[dev-dependencies]
crc32fast.workspace = true
tempfile.workspace = true
wfscan-fixtures.workspace = true
