[package]
name = "wfscan-gui"
description = "Desktop front end for wfscan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui 0.36 needs 1.95; the core library and CLI build on the workspace MSRV.
rust-version = "1.95"

[[bin]]
name = "wfscan-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
# Previews decode textures and sounds, so the GUI always has Oodle and the decoders.
wfscan-core = { workspace = true, features = ["oodle", "png", "audio"] }

# Playback through Windows' own waveOut API (MIT or Apache-2.0 bindings).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }

[dev-dependencies]
egui_kittest = "0.36"
tempfile.workspace = true
wfscan-fixtures.workspace = true
